# 로컬 개발용 — Kafka 단일 브로커(KRaft) + Postgres 16. 클러스터에서는 MSK·RDS 를 쓴다.
#   docker compose up -d kafka postgres          # 인프라만 띄우고 API·워커는 로컬 .venv 로
#   docker compose up -d --build                 # API·워커까지 컨테이너로
# 호스트에서는 Kafka localhost:9092, Postgres localhost:5432 (review/review).
services:
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20

  postgres:
    image: postgres:16
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: oneaction_review
      POSTGRES_USER: review
      POSTGRES_PASSWORD: review
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U review -d oneaction_review"]
      interval: 3s
      retries: 20

  api:
    build: {context: ., dockerfile: api/Dockerfile}
    profiles: [app]
    ports:
      - "127.0.0.1:8080:8080"
    environment: &app-env
      KAFKA_BOOTSTRAP: kafka:19092
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: oneaction_review
      DB_USERNAME: review
      DB_PASSWORD: review
      DB_SSLMODE: disable
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-local-webhook-secret}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}

  worker:
    build: {context: ., dockerfile: worker/Dockerfile}
    profiles: [app]
    environment: *app-env
    depends_on:
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}

volumes:
  postgres-data:
