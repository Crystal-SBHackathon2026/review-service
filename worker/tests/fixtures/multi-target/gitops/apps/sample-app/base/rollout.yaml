# Argo Rollouts: 새 버전이 progressDeadlineSeconds 안에 헬스체크(readiness)를 통과하지 못하면
# 배포를 자동 중단(abort)하고 기존(stable) 버전을 계속 서비스한다.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: sample-app
  labels:
    app: sample-app
spec:
  replicas: 2
  progressDeadlineSeconds: 60
  progressDeadlineAbort: true
  strategy:
    canary:
      maxSurge: 1
      maxUnavailable: 0
      # 새 버전을 한 번에 다 바꾸지 않고 절반만 먼저 내보낸다.
      # 명세의 rollout.strategy 가 canary 면 렌더러가 이 설정을 그대로 둔다
      # (bluegreen 이면 strategy 를 통째로 바꾼다).
      #
      # 가중치는 파드 수로 환산된다. 지금 명세는 replicas 3 이라 50% = 새 버전 2 + 옛 버전 1 이다.
      # 그 상태에서 분석이 앱 응답을 60초 동안 재고, 멀쩡하면 100% 로 넘어간다.
      # 실패하면 중단하고 옛 버전으로 되돌린다.
      # sample-app-health 의 **내용은 환경마다 다르다.** base 에 두지 않고
      # Argo CD Application 이 ../analysis/{default,prometheus} 중 하나를
      # 두 번째 소스로 가져간다. Prometheus 가 있는 환경에서만 에러율을 본다 (#24).
      steps:
        - setWeight: 50
        - analysis:
            templates:
              - templateName: sample-app-health
            # 🔴 카나리 파드만 재기 위한 값. Latest = 지금 올라가는(카나리) 파드 해시다.
            # Stable 로 바꾸면 옛 파드를 재게 되어 아무 의미가 없다.
            args:
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
        app: sample-app
    spec:
      containers:
        - name: sample-app
          image: ghcr.io/crystal-sbhackathon2026/sample-app
          ports:
            - containerPort: 8080
          env:
            - name: DEPLOY_ENV
              value: base
            - name: DEPLOY_REGION
              value: unknown
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
