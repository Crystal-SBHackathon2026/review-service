# 생성 파일 — review-service overlay 렌더러가 deploy_spec 에서 만든다.
# 손으로 고치지 말고 앱 레포의 deploy.yaml 을 고친다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sample-app
resources:
- ../../base
- ingress.yaml
patches:
- target:
    kind: Rollout
    name: sample-app
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 3
    - op: add
      path: /spec/template/spec/containers/-
      value:
        name: sample-app
        ports:
        - containerPort: 8080
        env:
        - name: DEPLOY_ENV
          value: aws
        - name: DEPLOY_REGION
          value: ap-northeast-2
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
    - op: copy
      from: /spec/template/spec/containers/0/image
      path: /spec/template/spec/containers/1/image
    - op: remove
      path: /spec/template/spec/containers/0
    - op: add
      path: /spec/template/spec/terminationGracePeriodSeconds
      value: 30
- target:
    kind: Service
    name: sample-app
  patch: |-
    - op: replace
      path: /spec/ports/0/targetPort
      value: 8080
