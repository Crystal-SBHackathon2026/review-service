# 대상 환경 능력표 — DB-002·STO-001·RUN-004 와 overlay 렌더러가 읽는다.
# verified: false 는 아직 실측 전. 팀이 클러스터를 만들면 값을 확인해 true 로 바꾼다.
# database: placement → engine → 지원 메이저 버전. 버전 목록이 []면 버전 무관.
# volume_access_modes: [] 면 그 환경은 PVC 를 만들 수 없다 (STO-001 이 막고, 렌더러는 blocking 경고).
# storage_class: PVC 에 적을 storageClassName (없으면 클러스터 기본 클래스).
# volume_reclaim_policy: 그 클래스의 reclaimPolicy (기본 Delete). Retain 이면 렌더러가 VOLUME_RETAINED 경고를 붙인다.
# ingress: overlay 렌더러(review_ai/overlay)가 쓰는 Ingress 클래스와 환경 고정 annotation.

targets:
  aws:
    # 2026-10-08 실측 (EKS 인계서 · Notion "배포 에이전트 설계" 6절): oneaction EKS 1.36,
    # t3.medium 2대(AL2023 x86_64), 애드온은 VPC CNI·kube-proxy·CoreDNS·Pod Identity Agent 4개뿐(Terraform 고정).
    # 2026-10-10 갱신 (Slack, 박찬건): EBS CSI 사용 가능 — StorageClass oneaction-monitoring-gp3(Retain)에
    # Prometheus 10Gi·Grafana 2Gi PVC 가 Bound. 같은 클래스를 일반 앱 PVC 에도 쓴다. 노드는 지금 3대 Ready.
    # 클래스 정의는 인프라 레포 infra/eks-storage/manifests/storage-class.yaml (gitops·terraform 아님) —
    # volumeBindingMode WaitForFirstConsumer 라 PV 는 Pod 가 놓인 노드의 AZ 에 만들어진다(AZ 불일치 없음).
    verified: true
    arch: [amd64]
    database:
      # RDS postgres 16.15 는 있지만 앱마다 DB 를 만드는 수단(Crossplane)이 아직 없다 →
      # 검토는 통과시키고 렌더러가 DB_PROVISIONING_REQUIRED(blocking)로 배포를 멈춘다.
      managed: {postgres: ["16"], mysql: ["8.0"]}
      # in-cluster·volume(SQLite)은 PVC 로 만들 수 있지만 일부러 열지 않는다(10/10 결정) — EBS 는 단일 AZ·Retain 이라
      # DB 를 올리려면 백업·AZ 장애·정리 절차를 먼저 정해야 한다. SQLite 앱은 managed postgres 변환(DB_SQLITE_TO_POSTGRES)으로 간다.
      external: {postgres: [], mysql: []}
    volume_access_modes: [ReadWriteOnce]           # EBS gp3. 단일 AZ — 공유·여러 AZ 동시 마운트(ReadWriteMany)는 EFS 가 필요
    storage_class: oneaction-monitoring-gp3
    volume_reclaim_policy: Retain                  # PVC 를 지워도 PV·EBS 와 과금이 남는다 → VOLUME_RETAINED
    # ESO 동기화는 아직 platform namespace 에만 설정돼 있다. 앱 namespace 의 aws-secrets-manager 는
    # 렌더러 SECRET_KEYS_REQUIRED 경고대로 Secret 이 미리 있어야 한다.
    secret_sources: [aws-secrets-manager, k8s-secret, generated]
    ingress:
      class: alb                   # AWS Load Balancer Controller
      annotations:                 # gitops overlays/aws/ingress.yaml 과 같은 값
        alb.ingress.kubernetes.io/tags: Project=oneaction,Owner=seongjin.lee,Env=dev

  gcp:
    verified: false
    arch: [amd64]
    database:
      managed: {postgres: ["16"], mysql: ["8.0"]}   # Cloud SQL — Terraform 미작성
      in-cluster: {postgres: ["16"]}
      volume: {sqlite: []}
      external: {postgres: [], mysql: []}
    volume_access_modes: [ReadWriteOnce]           # PD. Filestore 를 붙이면 ReadWriteMany
    secret_sources: [gcp-secret-manager, k8s-secret, generated]
    ingress:
      class: gce                   # 내부 전용이면 gce-internal
      annotations: {}

  local:
    # 온프레미스 k3s. 명세로 판정할 수 없는 운영 조건 — 배포 전에 사람이 확인한다 (knowledge/guides/onprem-*.md)
    # - 노드 주소: DHCP 로 바뀌면 프록시 upstream·방화벽·터널 대상이 동시에 깨진다 → DHCP 예약(고정 할당) 확인
    # - 노출 경로: overlay 는 public 값과 무관하게 같은 Traefik Ingress 를 만든다(NET-003). 내부 전용은 터널 ingress·
    #   라우터 포트포워딩·NodePort 가 지킨다
    # - 백업: 관리형 DB·볼륨 스냅샷이 없다. 클러스터 안 DB 는 직접 밖으로 백업한다(DB-010)
    # 2026-10-10 실측 (Slack, 이성진): k3d crystal-busan · k3s v1.35.5+k3s1 · 노드 2대(server+agent, WSL2 위 컨테이너)
    # · 노드당 CPU 8·메모리 7.6Gi · Argo CD v3.5.4·Argo Rollouts v1.10.0 · Prometheus 없음(monitoring namespace 없음)
    # → 카나리 분석은 api-ok 만, error-rate 는 aws 에서만 돈다.
    verified: true
    arch: [amd64]                  # 2026-10-10 실측 (containerd 2.2.3)
    database:
      in-cluster: {postgres: ["16"]}
      volume: {sqlite: []}
      external: {postgres: [], mysql: []}
    # k3s 기본 클래스 local-path (WaitForFirstConsumer·RWO, 128Mi PVC Bound·쓰기 실측). storage_class 는 비워 기본 클래스를 쓴다.
    # PV 가 노드 로컬 디스크라 처음 뜬 노드에 묶인다 — canary 의 새 Pod 도 같은 노드에만 뜬다(렌더러 같은 노드 affinity 와 같은 결과).
    volume_access_modes: [ReadWriteOnce]
    # reclaimPolicy Delete — PVC 를 지우면 데이터도 사라진다(aws 의 Retain 과 반대). 그래서 VOLUME_RETAINED 경고는 붙지 않는다.
    volume_reclaim_policy: Delete
    secret_sources: [k8s-secret, generated]
    ingress:
      class: traefik               # k3s 기본
      annotations: {}
