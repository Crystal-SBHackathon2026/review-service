# 로컬 k3s 에 mysql 을 요청 — 로컬은 in-cluster postgres 만 지원. 첫 배포(데이터 없음).
# 기대: DB-002(high, when_no_data → allowed) → fix (engine postgres 16 으로 전환) → pass
# 구버전 drawio 의 "DB 엔진 변경 자동 수정" 데모를 첫 배포에 한정한 버전. 데이터가 있으면 04 처럼 사람 승인.
api_version: crystal.review/v1alpha1
kind: DeploySpec
metadata: {name: orders, repository: Crystal-SBHackathon2026/sample-orders, commit: 9d41a07}
target: {env: local, region: busan-local}
image: {repository: ghcr.io/crystal-sbhackathon2026/sample-orders, tag: 9d41a07, digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef, platforms: [amd64, arm64]}
runtime:
  port: 8080
  replicas: 2
  health: {readiness: /readyz, liveness: /livez}
  resources: {cpu_request: 100m, memory_request: 128Mi, cpu_limit: 500m, memory_limit: 256Mi}
requirements: {persistence: true}
database: {engine: mysql, version: "8.0", placement: in-cluster}
secrets:
  - {name: DATABASE_URL, source: generated}
network:
  ingress: {public: false, allowed_cidrs: [192.168.0.0/16]}
