    verdict: fix
    reasons: []
    after_patch: {findings: [DB-010], verdict: pass}
  - file: 06-human-plaintext-secret.yaml
    findings: [SEC-001]
    verdict: needs_human
    reasons: [AUTOFIX_FORBIDDEN]
    evidence_must_not_contain: [sample-not-a-real-token-0000]
  - file: 07-fix-public-bucket.yaml
    findings: [STO-003]
    verdict: fix
    reasons: []
    after_patch: {findings: [], verdict: pass}
  - file: 08-human-volume-shrink-local.yaml
