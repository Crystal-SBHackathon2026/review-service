# CI: 테스트(api·worker) → 이미지 빌드(api·worker) → 취약점 검사 → (main만) GHCR 푸시 → gitops 이미지 태그 갱신
# ai/ 테스트·정합성 검사는 ai-ci.yml 이 따로 돈다.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: "**/pyproject.toml"
      - name: 의존성 설치
        run: pip install -e "./ai[dev]" -e ./common -e "./api[dev]" -e "./worker[dev]"
      - name: api 테스트
        working-directory: api
        run: pytest -q
      - name: worker 테스트
        working-directory: worker
        run: pytest -q

  integration:
    # 실제 Postgres·Kafka 로 tests/integration (API → Kafka → 워커 → 웹훅 → 병합) 을 돌린다
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: oneaction_review
          POSTGRES_USER: review
          POSTGRES_PASSWORD: review
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U review -d oneaction_review"
          --health-interval 3s --health-retries 20
      kafka:
        image: apache/kafka:3.9.1
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
        ports: ["9092:9092"]
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval 5s --health-timeout 10s --health-retries 20
    env:
      REVIEW_IT_DSN: postgresql://review:review@localhost:5432/oneaction_review
      KAFKA_BOOTSTRAP: localhost:9092
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: "**/pyproject.toml"
      - name: 의존성 설치
        run: pip install -e "./ai[dev]" -e ./common -e "./api[dev]" -e "./worker[dev]"
      - name: 통합 테스트 (skip 이 있으면 실패)
        # 기본 셸(bash -e)엔 pipefail 이 없어 `pytest | tee` 가 tee 의 종료 코드로 끝난다 — 실패해도 초록 (#54)
        shell: bash
        run: |
          pytest -q -rs | tee result.txt
          ! grep -q "skipped" result.txt

  build:
    needs: [test, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api, worker]
    env:
      IMAGE: ghcr.io/crystal-sbhackathon2026/review-${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7

      - name: 이미지 빌드
        run: docker build -f "${{ matrix.service }}/Dockerfile" -t "$IMAGE:${{ github.sha }}" .

      - name: 취약점 검사 (CRITICAL 발견 시 실패)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: GHCR 로그인
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 푸시
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  update-gitops:
    # gitops apps/review-service 의 이미지 태그(api·worker 공통)를 이 커밋 SHA 로 갱신 → Argo CD 가 변화를 감지한다
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
    steps:
      - name: GitOps 레포 이미지 태그 갱신
        if: env.GITOPS_TOKEN != ''
        run: |
          git clone "https://x-access-token:${GITOPS_TOKEN}@github.com/Crystal-SBHackathon2026/gitops.git"
          cd gitops
          sed -i "s/newTag: .*/newTag: ${{ github.sha }}/" apps/review-service/kustomization.yaml
          git config user.name "crystal-ci"
          git config user.email "crystal-ci@users.noreply.github.com"
          if ! git commit -am "chore: review-service 이미지 태그 갱신 (${GITHUB_SHA::7})"; then
            echo "변경 없음"; exit 0
          fi
          # gitops 에 커밋하는 곳이 셋(sample-app CI, review-service CI, commit_overlay)이라 push 가 겹칠 수 있다
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 2))
          done
          exit 1
      - name: 토큰 없음 안내
        if: env.GITOPS_TOKEN == ''
        run: echo "GITOPS_TOKEN 시크릿이 없어 GitOps 갱신을 건너뜁니다."
