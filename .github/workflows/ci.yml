# CI: 테스트(api·worker) → 이미지 빌드(api·worker) → 취약점 검사 → (main만) GHCR 푸시
# ai/ 테스트·정합성 검사는 ai-ci.yml 이 따로 돈다.
# 배포 매니페스트는 gitops 레포 apps/review-service/ 에 있다. 이미지 태그 갱신은 지금은 사람이 PR 로 한다.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: "**/pyproject.toml"
      - name: 의존성 설치
        run: pip install -e "./ai[dev]" -e ./common -e "./api[dev]" -e "./worker[dev]"
      - name: api 테스트
        working-directory: api
        run: pytest -q
      - name: worker 테스트
        working-directory: worker
        run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api, worker]
    env:
      IMAGE: ghcr.io/crystal-sbhackathon2026/review-${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7

      - name: 이미지 빌드
        run: docker build -f "${{ matrix.service }}/Dockerfile" -t "$IMAGE:${{ github.sha }}" .

      - name: 취약점 검사 (CRITICAL 발견 시 실패)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: GHCR 로그인
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 푸시
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
